name: Build Windows installer

on:
  workflow_dispatch:      # lets you press a "Run workflow" button
  push:
    branches: [main]
    paths:                # the Android files do not start this build
      - "main.py"
      - "ipcore.py"
      - "installer.iss"
      - "version_info.txt"
      - "requirements.txt"
      - "assets/**"
      - "windows-release-notes.md"
      - ".github/workflows/build.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          # PyInstaller's ready-made launcher is the thing antivirus programs most often
          # flag. Building it from source here gives every release a unique launcher.
          pip install --no-binary pyinstaller pyinstaller
          if ($LASTEXITCODE -ne 0) {
            Write-Host "Building PyInstaller from source failed; using the ready-made one."
            pip install pyinstaller
          }
          pyinstaller --version

      - name: Run tests
        run: python -m unittest discover -s . -p "test_*.py" -v

      - name: Build the program
        run: >
          pyinstaller --noconfirm --clean --windowed --noupx --name Mostafa-MultiWidget
          --hidden-import psutil
          --icon assets/images/icon.ico
          --version-file version_info.txt
          --add-data "assets;assets"
          --collect-submodules pystray
          main.py

      - name: Check the built program
        shell: pwsh
        run: |
          $env:MYIP_SELFTEST_REPORT = Join-Path $PWD "selftest.txt"
          $p = Start-Process -FilePath "dist\Mostafa-MultiWidget\Mostafa-MultiWidget.exe" -ArgumentList "--selftest" -Wait -PassThru
          if (Test-Path $env:MYIP_SELFTEST_REPORT) { Get-Content $env:MYIP_SELFTEST_REPORT }
          if ($p.ExitCode -ne 0) { throw "Self-test failed with exit code $($p.ExitCode)" }

      - name: Build the installer
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" installer.iss
          if ($LASTEXITCODE -ne 0) { throw "Installer build failed" }

      - name: Name the installer file (with the version)
        id: out
        shell: pwsh
        run: |
          $ver = (Select-String -Path installer.iss -Pattern '#define AppVersion "([^"]+)"').Matches[0].Groups[1].Value
          $name = "Mostafa-MultiWidget-Windows-Setup-v$ver.exe"
          Copy-Item installer_output/Mostafa-MultiWidget-Setup.exe $name
          "version=$ver" >> $env:GITHUB_OUTPUT
          "file=$name" >> $env:GITHUB_OUTPUT
          "## Mostafa MultiWidget for Windows $ver" >> $env:GITHUB_STEP_SUMMARY

      - name: Keep the installer (download it from the run page)
        uses: actions/upload-artifact@v4
        with:
          name: Mostafa-MultiWidget-Windows-v${{ steps.out.outputs.version }}
          path: ${{ steps.out.outputs.file }}

      - name: Publish a Release (with the changes written in it)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: windows-v${{ steps.out.outputs.version }}
          name: Mostafa MultiWidget for Windows ${{ steps.out.outputs.version }}
          body_path: windows-release-notes.md
          files: ${{ steps.out.outputs.file }}
          make_latest: false   # the Android app's update check reads the latest Release: this one must not take its place
